<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>octo</title>
    <link rel="stylesheet" href="/client/style.css" />
  </head>
  <body>
    <header>
      <h1><a href="#" id="home">octo</a></h1>
      <p id="directory" class="directory"></p>
    </header>
    <main id="list">
      <h2>Notebooks</h2>
      <p id="status" class="status">Looking for notebooks…</p>
      <ul id="notebooks" class="notebooks"></ul>
    </main>
    <main id="session" hidden>
      <div class="session-header">
        <div>
          <h2 id="title"></h2>
          <p id="notebook" class="path"></p>
        </div>
        <div class="controls">
          <button id="run-all" type="button">Run all</button>
          <button id="interrupt" type="button" disabled>Interrupt</button>
          <button id="edit" type="button">Edit</button>
          <button id="duplicate" type="button">Duplicate</button>
        </div>
      </div>
      <p id="session-status" class="status"></p>
      <ol id="segments" class="segments"></ol>
      <form id="editor" class="editor" hidden>
        <div class="editor-controls">
          <button id="save" type="submit">Save</button>
          <button id="cancel" type="button">Cancel</button>
          <p id="editor-status" class="status"></p>
        </div>
        <div id="draft"></div>
      </form>
    </main>
    <script type="module" src="/client/main.js"></script>
  </body>
</html>
